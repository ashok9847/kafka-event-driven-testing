[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: Integration tests requiring Kafka broker (or Testcontainers)
    unit: Pure unit tests for serializers, validators, and retry logic
    dlq: Dead-Letter Queue failure routing and poison pill tests
    idempotency: Deduplication and message replay tests
